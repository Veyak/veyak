[workspace]
members = [
    "src-tauri",
    "crates/veyak-auth",
    "crates/veyak-models",
    "crates/veyak-db",
    "crates/veyak-error",
    "crates/veyak-grpc",
    "crates/veyak-graphql",
    "crates/veyak-import-export",
]
resolver = "2"

[profile.release]
codegen-units = 1

[workspace.dependencies]
ts-rs = "12.0.1"
reqwest = "0.13.4"
serde = "1.0.229"
tokio = "1.52.3"
serde_json = "1.0.151"
glib = "0.20.0"
