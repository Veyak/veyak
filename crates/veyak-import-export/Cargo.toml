[package]
name = "veyak-import-export"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = "0.9.34"
uuid = { version = "1.24.1", features = ["v4"] }
chrono = "0.4.45"
url = "2.5.8"
veyak-models = { path = "../veyak-models" }
veyak-error = { path = "../veyak-error" }
veyak-db = { path = "../veyak-db" }

[dev-dependencies]
tempfile = "3.17"
